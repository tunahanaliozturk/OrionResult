<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1200" height="560" fill="#ffffff"/>

  <text class="title" x="40" y="52">OrionResult - one result and error vocabulary</text>
  <text class="subtitle" x="40" y="78">Your code returns Result&lt;T&gt; or Option&lt;T&gt;; a failure is an Error value; cross-cutting code reads it through Orion.Abstractions.</text>

  <!-- application -->
  <rect class="ext" x="40" y="170" width="190" height="258" rx="14"/>
  <text class="label" x="135" y="290" text-anchor="middle">Your application</text>
  <text class="small" x="135" y="312" text-anchor="middle">services, handlers,</text>
  <text class="small" x="135" y="330" text-anchor="middle">endpoints</text>
  <path class="flow" d="M230,299 L288,299"/>
  <text class="edge" x="259" y="289" text-anchor="middle">uses</text>

  <!-- OrionResult package -->
  <rect class="note" x="290" y="110" width="575" height="330" rx="12"/>
  <text class="label" x="310" y="140">OrionResult</text>
  <text class="small" x="410" y="140">namespace Moongazing.OrionResult</text>

  <rect class="step" x="320" y="170" width="200" height="76" rx="14"/>
  <text class="code" x="420" y="203" text-anchor="middle">Option&lt;T&gt;</text>
  <text class="small" x="420" y="225" text-anchor="middle">Some(value) or None</text>

  <path class="flow" d="M520,208 L638,208"/>
  <text class="code" x="579" y="198" text-anchor="middle">ToResult</text>

  <rect class="step" x="640" y="170" width="210" height="76" rx="14"/>
  <text class="code" x="745" y="203" text-anchor="middle">Result&lt;T&gt;</text>
  <text class="small" x="745" y="225" text-anchor="middle">value, or Error[] on failure</text>

  <path class="flow" d="M745,246 L745,298"/>
  <text class="edge" x="735" y="277" text-anchor="end">on failure</text>

  <rect class="step" x="320" y="300" width="200" height="56" rx="12"/>
  <text class="code" x="420" y="323" text-anchor="middle">ErrorKind</text>
  <text class="small" x="420" y="343" text-anchor="middle">Validation, NotFound, ...</text>

  <rect class="step" x="320" y="372" width="200" height="56" rx="12"/>
  <text class="code" x="420" y="395" text-anchor="middle">FieldError</text>
  <text class="small" x="420" y="415" text-anchor="middle">Field, Message</text>

  <path class="flow" d="M520,328 L638,328"/>
  <text class="edge" x="579" y="318" text-anchor="middle">Kind</text>
  <path class="flow" d="M520,400 L638,400"/>
  <text class="edge" x="579" y="390" text-anchor="middle">Fields</text>

  <rect class="step" x="640" y="300" width="210" height="128" rx="14"/>
  <text class="code" x="745" y="345" text-anchor="middle">Error</text>
  <text class="small" x="745" y="367" text-anchor="middle">Code, Message, Kind</text>
  <text class="small" x="745" y="387" text-anchor="middle">Fields?, Extensions?</text>

  <!-- Orion.Abstractions -->
  <rect class="note" x="995" y="110" width="165" height="330" rx="12"/>
  <text class="label" x="1008" y="140">Orion.Abstractions</text>

  <rect class="ext" x="1005" y="170" width="145" height="76" rx="14"/>
  <text class="code" x="1077" y="203" text-anchor="middle">IOrionResult&lt;T&gt;</text>
  <text class="small" x="1077" y="225" text-anchor="middle">IsSuccess, Value, Error</text>

  <path class="flow" d="M1077,246 L1077,324"/>
  <text class="edge" x="1067" y="290" text-anchor="end">Error</text>

  <rect class="ext" x="1005" y="326" width="145" height="76" rx="14"/>
  <text class="code" x="1077" y="359" text-anchor="middle">OrionError</text>
  <text class="small" x="1077" y="381" text-anchor="middle">Code, Message, Target</text>

  <path class="flow" d="M850,208 L1003,208"/>
  <text class="edge" x="930" y="198" text-anchor="middle">implements</text>
  <path class="flow" d="M850,364 L1003,364"/>
  <text class="code" x="930" y="354" text-anchor="middle">ToOrionError()</text>

  <!-- note -->
  <rect class="note" x="290" y="464" width="870" height="66" rx="10"/>
  <text class="small" x="310" y="492">IOrionResult.Error on a failed Result&lt;T&gt; returns the first Error mapped with ToOrionError(); the first FieldError's</text>
  <text class="small" x="310" y="512">name becomes OrionError.Target. On success it is null. Option&lt;T&gt; does not implement IOrionResult.</text>
</svg>
