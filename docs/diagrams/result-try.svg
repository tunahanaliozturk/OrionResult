<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1200" height="610" fill="#ffffff"/>

  <text class="title" x="40" y="52">OrionResult - Result.Try at a throwing boundary</text>
  <text class="subtitle" x="40" y="78">An exception from a throwing API is caught once and becomes an Error. Cancellation is never swallowed.</text>

  <!-- start -->
  <rect class="step" x="40" y="150" width="240" height="76" rx="14"/>
  <text class="code" x="160" y="183" text-anchor="middle">Result.Try(operation,</text>
  <text class="code" x="160" y="203" text-anchor="middle">onException)</text>

  <path class="flow" d="M280,188 L318,188"/>

  <!-- decision 1 -->
  <polygon class="decision" points="430,122 540,188 430,254 320,188"/>
  <text class="code" x="430" y="185" text-anchor="middle">operation()</text>
  <text class="small" x="430" y="204" text-anchor="middle">throws?</text>

  <!-- success -->
  <path class="flow" d="M540,188 L638,188"/>
  <text class="edge" x="589" y="178" text-anchor="middle">returns</text>
  <rect class="ok" x="640" y="150" width="240" height="76" rx="14"/>
  <text class="label" x="760" y="183" text-anchor="middle">Success(value)</text>
  <text class="small" x="760" y="205" text-anchor="middle">IsSuccess is true</text>

  <!-- exception -->
  <path class="flow alt" d="M430,254 L430,312"/>
  <text class="edge" x="440" y="288">throws ex</text>

  <polygon class="decision" points="430,314 540,380 430,446 320,380"/>
  <text class="code" x="430" y="376" text-anchor="middle">OperationCanceled</text>
  <text class="code" x="430" y="394" text-anchor="middle">Exception?</text>

  <path class="flow alt" d="M540,380 L638,380"/>
  <text class="edge" x="589" y="370" text-anchor="middle">no</text>
  <rect class="step" x="640" y="342" width="240" height="76" rx="14"/>
  <text class="code" x="760" y="375" text-anchor="middle">onException(ex)</text>
  <text class="small" x="760" y="397" text-anchor="middle">maps the fault to an Error</text>

  <path class="flow alt" d="M880,380 L918,380"/>
  <rect class="fail" x="920" y="342" width="240" height="76" rx="14"/>
  <text class="label" x="1040" y="375" text-anchor="middle">Failure(error)</text>
  <text class="small" x="1040" y="397" text-anchor="middle">returned as a value, not thrown</text>

  <path class="flow alt" d="M430,446 L430,498"/>
  <text class="edge" x="420" y="476" text-anchor="end">yes</text>
  <rect class="fail" x="310" y="500" width="240" height="72" rx="14"/>
  <text class="label" x="430" y="532" text-anchor="middle">Rethrown to the caller</text>
  <text class="small" x="430" y="553" text-anchor="middle">cancellation always propagates</text>

  <!-- note -->
  <rect class="note" x="640" y="470" width="520" height="102" rx="10"/>
  <text class="small" x="660" y="498">Other places that throw (programming errors, not outcomes):</text>
  <text class="small" x="660" y="518">new Error(code, message): blank code or message, ArgumentException.</text>
  <text class="small" x="660" y="538">Result.Failure(errors) with an empty list: ArgumentException.</text>
  <text class="small" x="660" y="558">Value on a failure or on None: InvalidOperationException.</text>
</svg>
